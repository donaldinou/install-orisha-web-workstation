---
# PHP is installed from Ondřej Surý's official APT repository (packages.sury.org),
# which replaces the old Launchpad PPA and covers Ubuntu 24.04 (noble) and 26.04.
# Signed repo -> compliant with the package-sources steering.
php_sury_keyring_url: https://packages.sury.org/debsuryorg-archive-keyring.deb
php_sury_keyring_deb: /tmp/debsuryorg-archive-keyring.deb
php_sury_keyring_path: /usr/share/keyrings/debsuryorg-archive-keyring.gpg
php_sury_repo: "deb [signed-by=/usr/share/keyrings/debsuryorg-archive-keyring.gpg] https://packages.sury.org/php/ {{ ansible_distribution_release }} main"

# PHP versions to install side by side.
php_versions:
  - "7.4"
  - "8.0"
  - "8.1"
  - "8.2"
  - "8.3"
  - "8.4"
  - "8.5"

# Extensions installed for every version. "json" is handled separately because
# it no longer exists as a standalone package on PHP >= 8.0 (built into core).
php_common_extensions:
  - apcu
  - cli
  - common
  - bcmath
  - bz2
  - curl
  - dev
  - fpm
  - gd
  - igbinary
  - imagick
  - intl
  - mbstring
  - mcrypt
  - memcached
  - mysql
  - opcache
  - redis
  - soap
  - ssh2
  - xdebug
  - xml
  - xsl
  - zip

# Extension only shipped as a standalone package on PHP 7.4 (built into core on
# 8.x): installed only for the version(s) listed here.
php_json_versions:
  - "7.4"

# Common extensions to EXCLUDE for specific versions, when an extension became a
# built-in with no standalone package. On PHP 8.5, opcache is native, so there
# is no php8.5-opcache package.
php_excluded_extensions:
  "8.5":
    - opcache

# Default PHP version for the system-wide "php" command (via update-alternatives).
php_default_version: "8.4"

# Composer (PHP dependency manager), installed globally as /usr/local/bin/composer
# using the official installer, with SHA-384 verification of the installer
# script (the signature is fetched live, never hardcoded, per Composer's docs).
php_install_composer: true
php_composer_installer_url: https://getcomposer.org/installer
php_composer_sig_url: https://composer.github.io/installer.sig
php_composer_bin: /usr/local/bin/composer

# Symfony CLI, installed from Symfony's official APT repository (Cloudsmith).
# The official method runs a setup script that configures the repo, then apt.
php_install_symfony_cli: true
php_symfony_repo_setup_url: "https://dl.cloudsmith.io/public/symfony/stable/setup.deb.sh"
php_symfony_repo_list: /etc/apt/sources.list.d/symfony-stable.list

# The package list is built in tasks/main.yml (a loop is clearer and safer than
# a single dense Jinja expression for per-version exclusions).
