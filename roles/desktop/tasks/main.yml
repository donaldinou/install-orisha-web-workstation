---
- name: Install standard desktop applications
  apt:
    name: "{{ desktop_apt_packages }}"
    state: present

- name: Create the APT keyrings directory
  file:
    path: "{{ desktop_keyring_dir }}"
    state: directory
    mode: "0755"

- name: Add the browsers' official GPG keys
  get_url:
    url: "{{ item.gpg_url }}"
    dest: "{{ item.gpg_path }}"
    mode: "0644"
  loop: "{{ desktop_apt_browsers }}"
  loop_control:
    label: "{{ item.name }}"

- name: Add the browsers' APT repositories
  apt_repository:
    repo: "{{ item.repo }}"
    filename: "{{ item.name }}"
    state: present
  loop: "{{ desktop_apt_browsers }}"
  loop_control:
    label: "{{ item.name }}"

- name: Pin browsers that need repository priority over Ubuntu defaults
  copy:
    dest: "/etc/apt/preferences.d/{{ item.name }}"
    content: "{{ item.pin }}\n"
    mode: "0644"
  loop: "{{ desktop_apt_browsers | selectattr('pin', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install browsers from APT repositories
  apt:
    name: "{{ desktop_apt_browsers | map(attribute='package') | list }}"
    state: present
    update_cache: yes

- name: Install desktop applications via Snap
  community.general.snap:
    name: "{{ item }}"
    state: present
  loop: "{{ desktop_snap_packages }}"

- name: Install Snaps that require interface connections (e.g. remmina)
  community.general.snap:
    name: "{{ item.name }}"
    state: present
  loop: "{{ desktop_snap_connections }}"
  loop_control:
    label: "{{ item.name }}"

- name: Check the current state of the Snap interface connections
  # A plug shows as connected when its line in "snap connections" has a non-"-"
  # slot in the third column.
  shell: "snap connections {{ item.0.name }} | awk '$2 == \"{{ item.0.name }}:{{ item.1 }}\" && $3 != \"-\"'"
  register: snap_conn_state
  changed_when: false
  failed_when: false
  loop: "{{ desktop_snap_connections | subelements('plugs') }}"
  loop_control:
    label: "{{ item.0.name }}:{{ item.1 }}"

- name: Connect the missing Snap interfaces
  command: "snap connect {{ item.item.0.name }}:{{ item.item.1 }} :{{ item.item.1 }}"
  when: item.stdout | trim == ""
  loop: "{{ snap_conn_state.results }}"
  loop_control:
    label: "{{ item.item.0.name }}:{{ item.item.1 }}"

- name: Install Flatpak
  apt:
    name: flatpak
    state: present

- name: Add the Flathub remote
  community.general.flatpak_remote:
    name: "{{ desktop_flatpak_remote_name }}"
    flatpakrepo_url: "{{ desktop_flatpak_remote_url }}"
    state: present

- name: Install desktop applications via Flatpak
  community.general.flatpak:
    name: "{{ item }}"
    remote: "{{ desktop_flatpak_remote_name }}"
    state: present
  loop: "{{ desktop_flatpak_packages }}"
