---
# Basic system tools installed on the workstation.
# Package names are chosen to be valid on Ubuntu 24.04 (noble) and 26.04.
# Notes on renamed/removed packages:
#   - "build-dep" is an apt subcommand, not a package -> dropped.
#   - "exfat-utils" was removed in 20.04+ -> replaced by "exfatprogs".
#   - "gnupg2" is a transitional package pointing to "gnupg" -> kept "gnupg" only.
system_base_packages:
  - systemd
  - build-essential
  - software-properties-common
  - apt-transport-https
  - ca-certificates
  - os-prober
  - curl
  - wget
  - gpg
  - gnupg
  - openssh-server
  - openssh-client
  - snapd
  - exfatprogs
  - exfat-fuse
  - gzip
  - zip
  - unzip
  - unrar
  - smbclient
  - cifs-utils
  - rename
  - libsecret-tools
  - mbr
  - pkg-config
  - libtool
  - packagekit-command-not-found
  - htop
  # util-linux-extra: extra util-linux tools (e.g. rename, fallocate, hardlink)
  # split out of util-linux on recent Ubuntu.
  - util-linux-extra

# APT components enabled before installing packages.
# "multiverse" is required for unrar; universe is enabled by default on Ubuntu.
system_apt_components:
  - multiverse

# VPN client. openvpn is the classic CLI; the network-manager-openvpn* packages
# add desktop integration (import/manage .ovpn from the GNOME UI).
system_vpn_packages:
  - openvpn
  - network-manager-openvpn
  - network-manager-openvpn-gnome

# OpenVPN 3 client, installed from OpenVPN's official APT repository (the
# vendor-recommended next-gen client, CLI: "openvpn3 session-start ...").
# https://openvpn.net/cloud-docs/ (OpenVPN 3 Linux client tutorial)
system_install_openvpn3: true
system_openvpn3_package: openvpn3
system_openvpn3_gpg_url: https://packages.openvpn.net/packages-repo.gpg
system_openvpn3_gpg_path: /etc/apt/keyrings/openvpn.asc
# Repository suite (Ubuntu codename). OpenVPN publishes per-LTS suites and may
# lag right after a new release ships. Defaults to the machine's own codename;
# override this (e.g. to the latest supported LTS) if the repo has no suite yet.
system_openvpn3_distro: "{{ ansible_distribution_release }}"
system_openvpn3_repo: "deb [signed-by=/etc/apt/keyrings/openvpn.asc] https://packages.openvpn.net/openvpn3/debian {{ system_openvpn3_distro }} main"

# Equivalent of the Ubuntu installer's "Install third-party software for
# graphics and Wi-Fi hardware" checkbox: proprietary drivers + firmware.
# ubuntu-drivers autoinstall detects and installs the right driver for the
# actual hardware.
system_install_third_party_drivers: true
system_driver_support_packages:
  - ubuntu-drivers-common
  - linux-firmware

# Equivalent of the installer's "Download and install support for additional
# media formats" checkbox: codecs, Microsoft fonts, etc.
# NOTE: this installs proprietary codecs and the Microsoft core fonts, whose
# EULA is pre-accepted non-interactively (see tasks). It requires multiverse.
system_install_restricted_extras: true
system_restricted_extras_package: ubuntu-restricted-extras

# fastfetch (system info tool). Available natively in Ubuntu universe from
# 25.04+/26.04, but NOT in 24.04 (noble) -> a PPA is used on older releases.
system_fastfetch_ppa: "ppa:zhangsongcui3371/fastfetch"

# Duration (in seconds) during which the APT cache is considered up to date.
system_apt_cache_valid_time: 3600
