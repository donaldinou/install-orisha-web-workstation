---
- name: Add the git-core PPA (newer Git than the Ubuntu repositories)
  apt_repository:
    repo: "{{ dev_tools_git_ppa }}"
    state: present

- name: Install Git and Git-related tools from the git-core PPA
  apt:
    name: "{{ dev_tools_git_packages }}"
    state: present
    update_cache: yes

- name: Add the Ansible PPA
  apt_repository:
    repo: "{{ dev_tools_ansible_ppa }}"
    state: present

- name: Install Ansible (kept as a workstation tool)
  apt:
    name: "{{ dev_tools_ansible_package }}"
    state: present
    update_cache: yes

- name: Install DevOps and networking CLI tools
  apt:
    name: "{{ dev_tools_devops_packages }}"
    state: present

- name: Install the Python development stack
  apt:
    name: "{{ dev_tools_python_packages }}"
    state: present

- name: Install development and build tools
  apt:
    name: "{{ dev_tools_dev_packages }}"
    state: present

- name: Install development libraries (-dev headers)
  apt:
    name: "{{ dev_tools_build_libs }}"
    state: present

- name: Install iOS device support (usbmuxd, libimobiledevice, ...)
  apt:
    name: "{{ dev_tools_ios_packages }}"
    state: present
  when: dev_tools_install_ios_support | bool

- name: Create the APT keyrings directory
  file:
    path: "{{ dev_tools_docker_keyring_dir }}"
    state: directory
    mode: "0755"

- name: Add Docker's official GPG key
  get_url:
    url: "{{ dev_tools_docker_gpg_url }}"
    dest: "{{ dev_tools_docker_gpg_path }}"
    mode: "0644"

- name: Add the Docker APT repository
  apt_repository:
    repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }} signed-by={{ dev_tools_docker_gpg_path }}] {{ dev_tools_docker_apt_url }} {{ ansible_distribution_release }} stable"
    filename: docker
    state: present

- name: Install Docker Engine and the Compose v2 plugin
  apt:
    name: "{{ dev_tools_docker_packages }}"
    state: present
    update_cache: yes

- name: Add the target user to the docker group (so they can run docker)
  # Adds the provisioned account (user_account_name from the user_account role),
  # not the person running the installer. Runs here because the docker group is
  # created by the Docker install just above. The user must log out/in for the
  # new group membership to take effect.
  user:
    name: "{{ dev_tools_docker_user if (dev_tools_docker_user | default('') | length > 0) else user_account_name }}"
    groups: docker
    append: yes
  when: >-
    (dev_tools_docker_user | default('') | length > 0)
    or (user_account_name | default('') | length > 0)

# --- Docker Desktop (standalone .deb, not in the APT repository) --------------

- name: Check whether Docker Desktop is already installed
  command: dpkg-query -W -f='${Status}' docker-desktop
  register: docker_desktop_installed
  changed_when: false
  failed_when: false
  when: dev_tools_install_docker_desktop | bool

- name: Download the Docker Desktop .deb package
  get_url:
    url: "{{ dev_tools_docker_desktop_url }}"
    dest: "{{ dev_tools_docker_desktop_deb }}"
    mode: "0644"
  when:
    - dev_tools_install_docker_desktop | bool
    - "'install ok installed' not in (docker_desktop_installed.stdout | default(''))"

- name: Install Docker Desktop from the downloaded .deb (resolves dependencies)
  apt:
    deb: "{{ dev_tools_docker_desktop_deb }}"
    state: present
  when:
    - dev_tools_install_docker_desktop | bool
    - "'install ok installed' not in (docker_desktop_installed.stdout | default(''))"

- name: Remove the downloaded Docker Desktop .deb
  file:
    path: "{{ dev_tools_docker_desktop_deb }}"
    state: absent
  when: dev_tools_install_docker_desktop | bool

# --- AWS CLI v2 (official zip installer, system-wide) -------------------------

- name: Check whether the AWS CLI is already installed
  stat:
    path: "{{ dev_tools_awscli_bin }}"
  register: awscli_bin
  when: dev_tools_install_awscli | bool

- name: Download and unpack the official AWS CLI v2 installer
  unarchive:
    src: "{{ dev_tools_awscli_url }}"
    dest: /tmp
    remote_src: yes
    creates: /tmp/aws/install
  when: dev_tools_install_awscli | bool

- name: Run the AWS CLI installer (install or update) system-wide
  command: >-
    /tmp/aws/install
    {{ '--update' if (awscli_bin.stat.exists | default(false)) else '' }}
  register: awscli_install
  changed_when: awscli_install.rc == 0
  when: dev_tools_install_awscli | bool

- name: Clean up the AWS CLI installer files
  file:
    path: /tmp/aws
    state: absent
  when: dev_tools_install_awscli | bool

# --- HashiCorp repository + Terraform -----------------------------------------

- name: Add HashiCorp's GPG key (dearmored to a binary keyring)
  # get_url cannot dearmor, so download then dearmor with gpg. "creates" makes
  # this idempotent.
  shell: >-
    curl -fsSL {{ dev_tools_hashicorp_gpg_url }}
    | gpg --dearmor -o {{ dev_tools_hashicorp_gpg_path }}
  args:
    creates: "{{ dev_tools_hashicorp_gpg_path }}"

- name: Add the HashiCorp APT repository
  apt_repository:
    repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }} signed-by={{ dev_tools_hashicorp_gpg_path }}] {{ dev_tools_hashicorp_apt_url }} {{ ansible_distribution_release }} main"
    filename: hashicorp
    state: present

- name: Install Terraform (and other HashiCorp tools)
  apt:
    name: "{{ dev_tools_hashicorp_packages }}"
    state: present
    update_cache: yes

- name: Install VS Code and other classic snaps
  community.general.snap:
    name: "{{ item }}"
    classic: yes
    state: present
  loop: "{{ dev_tools_classic_snaps }}"
