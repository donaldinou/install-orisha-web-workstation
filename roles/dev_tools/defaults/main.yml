---
# Outils de développement en ligne de commande.
dev_tools_cli_packages:
  - git
  - jq
  - tree

# Configuration du dépôt officiel Docker.
dev_tools_docker_keyring_dir: /etc/apt/keyrings
dev_tools_docker_gpg_url: https://download.docker.com/linux/ubuntu/gpg
dev_tools_docker_gpg_path: /etc/apt/keyrings/docker.asc
dev_tools_docker_apt_url: https://download.docker.com/linux/ubuntu

# Paquets Docker (Engine + plugin Compose v2).
dev_tools_docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# Snaps installés en mode classic (accès complet au système requis).
dev_tools_classic_snaps:
  - code
