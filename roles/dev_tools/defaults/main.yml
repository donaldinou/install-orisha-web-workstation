---
# Git is installed from the official git-core PPA, which ships a newer Git than
# the Ubuntu repositories. See tasks: the PPA is added before Git is installed.
dev_tools_git_ppa: "ppa:git-core/ppa"
dev_tools_git_packages:
  - git
  - git-extras
  - git-flow
  - git-lfs

# Ansible kept installed on the workstation as a tool (bootstrap.sh also
# installs it to run this playbook, but we declare it explicitly so it is
# guaranteed present regardless of how the playbook was launched).
dev_tools_ansible_ppa: "ppa:ansible/ansible"
dev_tools_ansible_package: ansible

# Python development stack.
dev_tools_python_packages:
  - python3
  - python3-dev
  - python3-virtualenv
  - python3-pip
  - pipx

# DevOps / networking CLI tools.
# Package names valid on Ubuntu 24.04 (noble) and 26.04.
dev_tools_devops_packages:
  - htop
  - jq
  - tree
  - nmap
  - net-tools
  - findutils
  - traceroute
  - xclip
  - gdebi
  - hardinfo
  - checkinstall
  - sshfs
  - mussh

# Development / build tools.
# Notes: "android-tools-adb" is now provided by "adb" on recent Ubuntu.
dev_tools_dev_packages:
  - kcachegrind
  - gcc
  - make
  - automake
  - autoconf
  - udev
  - meld
  - imagemagick
  - ghostscript
  - adb

# Development libraries (-dev headers) commonly needed to build native
# extensions (PHP/Python/Ruby/Node) and C projects.
# Notes on the original 20.04 list:
#   - "libc-dev" dropped: virtual package already provided by build-essential.
#   - "libusb-dev" dropped: legacy libusb 0.1, superseded by libusb-1.0-0-dev.
#   - "libmcrypt-dev" kept: still required by some legacy PHP (< 7.2) code.
dev_tools_build_libs:
  - libssl-dev
  - libcurl4-openssl-dev
  - libzip-dev
  - libbz2-dev
  - liblzma-dev
  - libicu-dev
  - libxslt1-dev
  - libmcrypt-dev

# iOS device support (debugging / manipulating Apple devices from the desktop).
# usbmuxd is the runtime daemon; the rest are tools and -dev headers.
# Toggle off with dev_tools_install_ios_support if a machine never touches iOS.
dev_tools_install_ios_support: true
dev_tools_ios_packages:
  - usbmuxd
  - libimobiledevice-utils
  - libimobiledevice-dev
  - libplist-dev
  - libplist++-dev
  - libusb-1.0-0-dev

# Official Docker repository configuration.
dev_tools_docker_keyring_dir: /etc/apt/keyrings
dev_tools_docker_gpg_url: https://download.docker.com/linux/ubuntu/gpg
dev_tools_docker_gpg_path: /etc/apt/keyrings/docker.asc
dev_tools_docker_apt_url: https://download.docker.com/linux/ubuntu

# Docker packages (Engine + Compose v2 plugin).
dev_tools_docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# Docker Desktop (GUI). Not available from the APT repository: it ships as a
# standalone .deb that must be downloaded and installed. It coexists with the
# docker-ce engine (Docker Desktop runs its own engine in an isolated VM).
#
# DISABLED for now: commercial use in larger enterprises (>250 employees or
# >$10M revenue) requires a paid Docker subscription, which we don't have yet.
# Set this back to true once the license is available; the install logic is
# already in place in tasks/main.yml.
dev_tools_install_docker_desktop: false
dev_tools_docker_desktop_url: https://desktop.docker.com/linux/main/amd64/docker-desktop-amd64.deb
dev_tools_docker_desktop_deb: /tmp/docker-desktop-amd64.deb

# Snaps installed in classic mode (require full system access).
dev_tools_classic_snaps:
  - code
